<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - អាខោន Admin & បញ្ចូលពេជ្រ Free Fire</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
            --ff-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            border-bottom: 1px solid #334155;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .auth-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .balance-badge {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--accent);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            min-height: 65vh;
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 1.5rem 0;
            justify-content: center;
        }

        .tab-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #0f172a;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .badge-cat {
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-ff {
            background: #d97706;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .badge-age {
            background: #475569;
            color: #e2e8f0;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .discount-badge {
            background: var(--danger);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 10px 0;
        }

        .original-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .final-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .desc-text {
            color: var(--text-muted);
            font-size: 0.88rem;
            margin: 8px 0 12px;
            white-space: pre-line;
        }

        .btn-buy {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background: var(--primary-hover);
        }

        .btn-soldout {
            width: 100%;
            background: #475569;
            color: #94a3b8;
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            cursor: not-allowed;
            font-weight: 600;
        }

        .empty-box {
            text-align: center;
            padding: 4rem 1.5rem;
            background: #1e293b;
            border-radius: 12px;
            border: 1px dashed #334155;
            margin-top: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            border-top: 1px solid #334155;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">YUTH <span>STORE</span></div>

            <div class="auth-box">
                <!-- Google Sign In -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="filled_blue"></div>

                <!-- User Profile Display -->
                <div id="userProfile" class="user-profile">
                    <img id="userImg" src="" alt="Profile">
                    <span id="userName" style="font-size: 0.85rem; font-weight:600;"></span>
                    <span class="balance-badge" id="userBalanceDisplay">លុយ: $0.00</span>
                    <button class="btn-logout" onclick="logoutUser()">ចាកចេញ</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>មជ្ឈមណ្ឌលអាខោន Admin & បញ្ចូលពេជ្រ Free Fire</h1>
            <p>សុវត្ថិភាពខ្ពស់ បញ្ចូលពេជ្ររហ័សទាន់ចិត្ត និងផ្ដល់សេវា 24/7</p>
        </section>

        <!-- Category Tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterCategory('ALL', this)">📦 ទាំងអស់</button>
            <button class="tab-btn" onclick="filterCategory('Free Fire', this)">💎 ពេជ្រ Free Fire</button>
            <button class="tab-btn" onclick="filterCategory('Facebook', this)">📘 Facebook Admin / BM</button>
            <button class="tab-btn" onclick="filterCategory('TikTok', this)">🎵 TikTok Ads</button>
            <button class="tab-btn" onclick="filterCategory('Telegram', this)">✈️ Telegram VIP</button>
        </div>

        <div id="productsContainer"></div>
    </main>

    <footer>
        <p>&copy; 2026 YUTH STORE. រក្សាសិទ្ធិគ្រប់យ៉ាង។</p>
    </footer>

    <script>
        let currentUser = null;
        let activeCategory = 'ALL';

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadProducts();
        }

        function loadProducts() {
            const stored = localStorage.getItem('yuth_products');
            let products = stored ? JSON.parse(stored) : [];
            const container = document.getElementById('productsContainer');

            if (activeCategory !== 'ALL') {
                products = products.filter(p => (p.category || '').toLowerCase().includes(activeCategory.toLowerCase()));
            }

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-box">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">📦</div>
                        <h3 style="color: #f8fafc;">មិនទាន់មានទំនិញ ឬកញ្ចប់ពេជ្រក្នុងជម្រើសនេះនៅឡើយទេ</h3>
                        <p style="color: var(--text-muted);">សូមរង់ចាំ Admin បញ្ចូលទំនិញបន្ថែម</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="grid">';
            products.forEach(p => {
                const discount = p.discount || 0;
                const finalPrice = (p.price - (p.price * (discount / 100))).toFixed(2);
                const isAvailable = p.status !== 'out_of_stock';
                const isFF = (p.category || '').includes('Free Fire');

                html += `
                    <div class="card">
                        <img src="${p.img}" class="card-img" alt="${p.name}">
                        <div class="card-body">
                            <div>
                                <div class="tag-row">
                                    <span class="${isFF ? 'badge-ff' : 'badge-cat'}">${p.category || 'ទូទៅ'}</span>
                                    <span class="badge-age">⏳ ${p.age || 'រហ័ស'}</span>
                                    ${discount > 0 ? `<span class="discount-badge">-${discount}%</span>` : ''}
                                </div>
                                <h3 style="font-size: 1.15rem; color: #fff; margin-bottom: 4px;">${p.name}</h3>
                                ${p.desc ? `<p class="desc-text">${p.desc}</p>` : ''}
                            </div>
                            <div>
                                <div class="price-box">
                                    <span class="final-price">$${finalPrice}</span>
                                    ${discount > 0 ? `<span class="original-price">$${Number(p.price).toFixed(2)}</span>` : ''}
                                </div>
                                ${isAvailable ? 
                                    `<button class="btn-buy" onclick="buyItem('${p.name}', ${finalPrice}, '${p.category || ''}')">
                                        ${isFF ? '💎 បញ្ចូលពេជ្រឥឡូវនេះ' : 'ទិញឥឡូវនេះ'}
                                    </button>` : 
                                    `<button class="btn-soldout" disabled>អស់ពីស្តុក</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            const storedUsers = localStorage.getItem('yuth_users');
            let users = storedUsers ? JSON.parse(storedUsers) : [];
            let existing = users.find(u => u.email === data.email);

            if (!existing) {
                existing = {
                    name: data.name,
                    email: data.email,
                    picture: data.picture,
                    balance: 0.00,
                    joinedAt: new Date().toLocaleString('km-KH')
                };
                users.push(existing);
                localStorage.setItem('yuth_users', JSON.stringify(users));
            }

            currentUser = existing;
            document.querySelector('.g_id_signin').style.display = 'none';
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userImg').src = currentUser.picture;
            document.getElementById('userBalanceDisplay').innerText = `លុយ: $${Number(currentUser.balance).toFixed(2)}`;

            alert(`🎉 ស្វាគមន៍ការចូលមកកាន់ YUTH STORE: ${currentUser.name}`);
        }

        function logoutUser() {
            currentUser = null;
            document.querySelector('.g_id_signin').style.display = 'block';
            document.getElementById('userProfile').style.display = 'none';
        }

        function buyItem(name, price, category) {
            if (!currentUser) {
                alert('⚠️ សូម Login ជាមួយ Google ជាមុនសិន ទើបអាចធ្វើការបញ្ជាទិញបាន!');
                return;
            }

            let playerId = "";
            if (category.includes('Free Fire')) {
                playerId = prompt("🎮 សូមបញ្ចូល Free Fire Player ID (UID) របស់អ្នកដើម្បីបញ្ចូលពេជ្រ:");
                if (!playerId || playerId.trim() === "") {
                    alert("❌ អ្នកត្រូវតែបញ្ចូល Player ID ទើបអាចបញ្ចូលពេជ្របាន!");
                    return;
                }
            }

            const currentBal = Number(currentUser.balance);
            if (currentBal >= price) {
                const confirmMsg = playerId ? 
                    `លោកអ្នកមានសមតុល្យ $${currentBal.toFixed(2)}។ តើអ្នកចង់កាត់ $${price.toFixed(2)} ដើម្បីបញ្ចូល "${name}" ទៅកាន់ UID: ${playerId} ដែរឬទេ?` :
                    `លោកអ្នកមានសមតុល្យ $${currentBal.toFixed(2)}។ តើអ្នកចង់កាត់ $${price.toFixed(2)} ដើម្បីទិញ "${name}" ដែរឬទេ?`;

                if (confirm(confirmMsg)) {
                    currentUser.balance = currentBal - price;

                    const users = JSON.parse(localStorage.getItem('yuth_users'));
                    const uIndex = users.findIndex(u => u.email === currentUser.email);
                    if (uIndex !== -1) {
                        users[uIndex].balance = currentUser.balance;
                        localStorage.setItem('yuth_users', JSON.stringify(users));
                    }

                    document.getElementById('userBalanceDisplay').innerText = `លុយ: $${currentUser.balance.toFixed(2)}`;
                    alert(`✅ កាត់ប្រាក់ជោគជ័យ! សមតុល្យនៅសល់៖ $${currentUser.balance.toFixed(2)}\nព័ត៌មានការទិញត្រូវបានបញ្ជូនទៅ Admin។`);

                    let textMsg = `[ទូទាត់ជោគជ័យតាម Wallet]\nឈ្មោះ៖ ${currentUser.name} (${currentUser.email})\nទំនិញ៖ ${name}\nតម្លៃ៖ $${price.toFixed(2)}`;
                    if (playerId) textMsg += `\n🎮 Free Fire UID: ${playerId}`;
                    
                    window.open(`https://t.me/your_telegram_username?text=${encodeURIComponent(textMsg)}`, '_blank');
                    return;
                }
            }

            // សមតុល្យមិនគ្រប់
            let directMsg = `សួស្តី YUTH STORE ខ្ញុំឈ្មោះ ${currentUser.name} (${currentUser.email})\nចង់ទិញ៖ ${name} ($${price.toFixed(2)})`;
            if (playerId) directMsg += `\n🎮 Free Fire UID: ${playerId}`;
            
            alert(`⚠️ សមតុល្យកាបូបមិនគ្រប់គ្រាន់ ($${currentBal.toFixed(2)})។ ប្រព័ន្ធនឹងភ្ជាប់ទៅ Telegram Admin ដើម្បីផ្ញើប្រាក់បង់ផ្ទាល់។`);
            window.open(`https://t.me/your_telegram_username?text=${encodeURIComponent(directMsg)}`, '_blank');
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
