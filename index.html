<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game & Account Store</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e293b; margin-bottom: 25px; }
        .user-balance { background: #1e293b; padding: 8px 16px; border-radius: 20px; border: 1px solid #38bdf8; font-weight: bold; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: #151e2e; border: 1px solid #243247; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .card-price { font-size: 18px; font-weight: bold; color: #10b981; margin-bottom: 15px; }
        .btn-buy { background: #38bdf8; color: #0b0f19; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto; }
        .btn-buy:hover { background: #0ea5e9; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 14px; width: 90%; max-width: 440px; border: 1px solid #334155; }
        .field-group { margin-bottom: 12px; }
        .field-group label { font-size: 12px; color: #94a3b8; }
        .field-box { display: flex; gap: 8px; margin-top: 4px; }
        .field-box input { flex-grow: 1; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-family: monospace; outline: none; }
        .btn-copy { padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🔥 ហាងទិញ-លក់ Account</h2>
        <div class="user-balance" id="displayBalance">💰 សមតុល្យ៖ $0.00</div>
    </div>

    <h3 style="color: #38bdf8; margin-bottom: 15px;">🛒 បញ្ជី Account ដាក់លក់</h3>
    <div class="grid" id="accountsList"></div>
</div>

<!-- Modal បង្ហាញព័ត៌មាន Login (ID, Password, 2FA) ពេលទិញជោគជ័យ -->
<div class="modal" id="accountPurchasedModal">
    <div class="modal-content">
        <h3 style="color: #10b981; text-align: center; margin-bottom: 5px;">🎉 ការទិញជោគជ័យ!</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 20px;">សូមចម្លងទុកព័ត៌មានគណនីរបស់អ្នក</p>

        <div class="field-group">
            <label>🆔 UID / Email / Username៖</label>
            <div class="field-box">
                <input type="text" id="dispAccId" readonly style="color:#38bdf8;">
                <button class="btn-copy" onclick="copyField('dispAccId')">📋 Copy</button>
            </div>
        </div>

        <div class="field-group">
            <label>🔑 Password (លេខសម្ងាត់)៖</label>
            <div class="field-box">
                <input type="text" id="dispAccPass" readonly style="color:#f59e0b;">
                <button class="btn-copy" onclick="copyField('dispAccPass')">📋 Copy</button>
            </div>
        </div>

        <div class="field-group">
            <label>🛡️ 2FA Key / Backup Code៖</label>
            <div class="field-box">
                <input type="text" id="dispAcc2fa" readonly style="color:#ec4899;">
                <button class="btn-copy" onclick="copyField('dispAcc2fa')">📋 Copy</button>
            </div>
        </div>

        <button onclick="copyAllAccountInfo()" style="width: 100%; padding: 10px; background: #10b981; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; margin-bottom: 8px;">
            📋 ចម្លងព័ត៌មានទាំងអស់ (Copy All)
        </button>
        <button onclick="document.getElementById('accountPurchasedModal').style.display='none'" style="width: 100%; padding: 10px; background: #475569; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
            បិទ
        </button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://yuth-store-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // គណនីភ្ញៀវតេស្ត (ប្តូរតាម Auth ជាក់ស្តែងរបស់អ្នក)
    let currentUser = {
        uid: "user_test_id",
        email: "client@gmail.com",
        balance: 20.00
    };

    function updateBalanceDisplay() {
        document.getElementById('displayBalance').innerText = `💰 សមតុល្យ៖ $${currentUser.balance.toFixed(2)}`;
    }
    updateBalanceDisplay();

    // ទាញយក Account មកបង្ហាញ
    db.ref('accounts_for_sale').on('value', snapshot => {
        const container = document.getElementById('accountsList');
        container.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = '<p style="color:#64748b;">មិនទាន់មាន Account ដាក់លក់នៅឡើយទេ។</p>';
            return;
        }

        for (let key in data) {
            const acc = data[key];
            if (acc.status === 'available') {
                container.innerHTML += `
                    <div class="card">
                        <img src="${acc.image || acc.thumb}">
                        <div class="card-body">
                            <div class="card-title">${acc.title}</div>
                            <div class="card-price">$${parseFloat(acc.price).toFixed(2)}</div>
                            <button class="btn-buy" onclick="buyAccount('${key}', ${acc.price})">🛒 ទិញភ្លាមៗ</button>
                        </div>
                    </div>
                `;
            }
        }
    });

    // ដំណើរការទិញ និងកាត់លុយ
    function buyAccount(accKey, price) {
        if (currentUser.balance < price) {
            return alert(`❌ សមតុល្យលុយមិនគ្រប់គ្រាន់!\nតម្លៃ៖ $${price.toFixed(2)}\nសមតុល្យអ្នក៖ $${currentUser.balance.toFixed(2)}\nសូមបញ្ចូលលុយជាមុនសិន!`);
        }

        if (!confirm(`តើអ្នកពិតជាចង់ទិញ Account នេះក្នុងតម្លៃ $${price.toFixed(2)} មែនទេ?`)) return;

        db.ref('accounts_for_sale/' + accKey).once('value').then(snapshot => {
            const acc = snapshot.val();
            if (!acc || acc.status === 'sold') {
                return alert("❌ សុំទោស អាខោននេះត្រូវបានគេទិញរួចរាល់ហើយ!");
            }

            currentUser.balance -= price;
            updateBalanceDisplay();

            // ប្តូរស្ថានភាព Account ទៅជា sold
            db.ref('accounts_for_sale/' + accKey).update({
                status: 'sold',
                buyerEmail: currentUser.email,
                soldAt: Date.now()
            });

            // បង្ហាញ ID, Pass, 2FA
            document.getElementById('dispAccId').value = acc.acc_id || 'N/A';
            document.getElementById('dispAccPass').value = acc.acc_pass || 'N/A';
            document.getElementById('dispAcc2fa').value = acc.acc_2fa || 'N/A';
            document.getElementById('accountPurchasedModal').style.display = 'flex';
        });
    }

    function copyField(id) {
        const val = document.getElementById(id).value;
        navigator.clipboard.writeText(val);
        alert("✅ បានចម្លង៖ " + val);
    }

    function copyAllAccountInfo() {
        const id = document.getElementById('dispAccId').value;
        const pass = document.getElementById('dispAccPass').value;
        const tfa = document.getElementById('dispAcc2fa').value;
        const text = `UID/Email: ${id}\nPassword: ${pass}\n2FA: ${tfa}`;
        navigator.clipboard.writeText(text);
        alert("✅ បានចម្លងព័ត៌មានទាំងអស់រួចរាល់!");
    }
</script>
</body>
</html>
