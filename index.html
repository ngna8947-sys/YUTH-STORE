<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Game Top-Up & Account Store</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e293b; margin-bottom: 25px; }
        .user-balance { background: #1e293b; padding: 8px 16px; border-radius: 20px; border: 1px solid #38bdf8; font-weight: bold; color: #38bdf8; }
        .section-title { color: #38bdf8; margin: 25px 0 15px 0; font-size: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .card { background: #151e2e; border: 1px solid #243247; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .btn-buy { background: #38bdf8; color: #0b0f19; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 14px; width: 90%; max-width: 440px; border: 1px solid #334155; }
        .field-group { margin-bottom: 12px; }
        .field-group label { font-size: 12px; color: #94a3b8; }
        .field-box { display: flex; gap: 8px; margin-top: 4px; }
        .field-box input { flex-grow: 1; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-family: monospace; outline: none; }
        .btn-copy { padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🔥 YUTH STORE</h2>
        <div class="user-balance" id="displayBalance">💰 សមតុល្យ៖ $0.00</div>
    </div>

    <!-- ១. បញ្ជីសេវាកម្ម Top-Up ហ្គេម (មុខងារចាស់) -->
    <h3 class="section-title">🎮 សេវាកម្មបញ្ចូលពេជ្រហ្គេម (Top-Up)</h3>
    <div class="grid" id="servicesGrid"></div>

    <!-- ២. បញ្ជី Account សម្រាប់ដាក់លក់ (មុខងារថ្មី) -->
    <h3 class="section-title">🛒 ហាងលក់ Account (Facebook / Game)</h3>
    <div class="grid" id="accountsGrid"></div>
</div>

<!-- Modal មើលព័ត៌មានលម្អិត & អាយុអាខោន មុនទិញ -->
<div class="modal" id="accPreviewModal">
    <div class="modal-content">
        <img id="prevImg" src="" style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:12px;">
        <h3 id="prevTitle" style="color:#38bdf8; margin-bottom:10px;"></h3>
        <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #334155;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span style="color:#94a3b8;">📅 អាយុអាខោន៖</span>
                <span id="prevAge" style="color:#f59e0b; font-weight:bold;"></span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:#94a3b8;">💵 តម្លៃ៖</span>
                <span id="prevPrice" style="color:#10b981; font-weight:bold; font-size:16px;"></span>
            </div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="document.getElementById('accPreviewModal').style.display='none'" style="flex:1; padding:10px; background:#475569; color:#fff; border:none; border-radius:8px; cursor:pointer;">បោះបង់</button>
            <button id="btnConfirmBuy" style="flex:2; padding:10px; background:#10b981; color:#fff; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">🛒 ទិញយកលេខសម្ងាត់</button>
        </div>
    </div>
</div>

<!-- Modal បង្ហាញ UID, Password, 2FA ពេលទិញជោគជ័យ -->
<div class="modal" id="accountPurchasedModal">
    <div class="modal-content">
        <h3 style="color: #10b981; text-align: center; margin-bottom: 5px;">🎉 ការទិញបានជោគជ័យ!</h3>
        <p style="font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 15px;">សូមចម្លងទុកព័ត៌មានគណនីរបស់អ្នក</p>

        <div class="field-group">
            <label>🆔 UID / Email / Username៖</label>
            <div class="field-box">
                <input type="text" id="dispAccId" readonly style="color:#38bdf8;">
                <button class="btn-copy" onclick="copyField('dispAccId')">📋 Copy</button>
            </div>
        </div>

        <div class="field-group">
            <label>🔑 Password (លេខសម្ងាត់)៖</label>
            <div class="field-box">
                <input type="text" id="dispAccPass" readonly style="color:#f59e0b;">
                <button class="btn-copy" onclick="copyField('dispAccPass')">📋 Copy</button>
            </div>
        </div>

        <div class="field-group">
            <label>🛡️ 2FA Key / Backup Code៖</label>
            <div class="field-box">
                <input type="text" id="dispAcc2fa" readonly style="color:#ec4899;">
                <button class="btn-copy" onclick="copyField('dispAcc2fa')">📋 Copy</button>
            </div>
        </div>

        <button onclick="copyAllInfo()" style="width: 100%; padding: 10px; background: #10b981; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; margin-bottom: 8px;">
            📋 ចម្លងព័ត៌មានទាំងអស់ (Copy All)
        </button>
        <button onclick="document.getElementById('accountPurchasedModal').style.display='none'" style="width: 100%; padding: 10px; background: #475569; color: #fff; border: none; border-radius: 8px; cursor: pointer;">
            បិទ
        </button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://yuth-store-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // គណនី Guest តេស្ត (ភ្ជាប់ Realtime User)
    let loggedInUser = {
        uid: "user_client_demo",
        email: "client@gmail.com",
        balance: 50.00
    };

    function updateUI() {
        document.getElementById('displayBalance').innerText = `💰 សមតុល្យ៖ $${loggedInUser.balance.toFixed(2)}`;
    }
    updateUI();

    // ១. បង្ហាញសេវាកម្ម Top-Up ហ្គេម (មុខងារចាស់)
    db.ref('services').on('value', snapshot => {
        const grid = document.getElementById('servicesGrid');
        grid.innerHTML = '';
        const data = snapshot.val();
        if (!data) return grid.innerHTML = '<p style="color:#64748b;">មិនទាន់មានសេវាកម្មទេ។</p>';

        for (let key in data) {
            const item = data[key];
            grid.innerHTML += `
                <div class="card" onclick="alert('ជ្រើសរើសសេវាកម្ម៖ ${item.name}')">
                    <img src="${item.image}">
                    <div class="card-body">
                        <div class="card-title">${item.name}</div>
                        <p style="font-size:12px; color:#94a3b8;">ចុចដើម្បីជ្រើសរើសកញ្ចប់ពេជ្រ</p>
                    </div>
                </div>
            `;
        }
    });

    // ២. បង្ហាញ Account សម្រាប់លក់ (មុខងារថ្មី)
    db.ref('accounts_for_sale').on('value', snapshot => {
        const grid = document.getElementById('accountsGrid');
        grid.innerHTML = '';
        const data = snapshot.val();
        if (!data) return grid.innerHTML = '<p style="color:#64748b;">មិនទាន់មាន Account ដាក់លក់ទេ។</p>';

        for (let key in data) {
            const item = data[key];
            if (item.status === 'available') {
                grid.innerHTML += `
                    <div class="card" onclick="openAccountPreview('${key}')">
                        <img src="${item.image || item.thumb}">
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div style="font-size:12px; color:#f59e0b; margin-bottom:6px;">📅 ${item.age || 'គុណភាពខ្ពស់'}</div>
                            <div style="color:#10b981; font-weight:bold; font-size:16px; margin-bottom:10px;">$${parseFloat(item.price).toFixed(2)}</div>
                            <button class="btn-buy">🔍 មើលព័ត៌មាន & ទិញ</button>
                        </div>
                    </div>
                `;
            }
        }
    });

    // បើកផ្ទាំង Preview មើលអាយុអាខោន
    function openAccountPreview(key) {
        db.ref('accounts_for_sale/' + key).once('value').then(snapshot => {
            const acc = snapshot.val();
            if (!acc) return;

            document.getElementById('prevImg').src = acc.image || acc.thumb;
            document.getElementById('prevTitle').innerText = acc.title;
            document.getElementById('prevAge').innerText = acc.age || 'មិនបានបញ្ជាក់';
            document.getElementById('prevPrice').innerText = `$${parseFloat(acc.price).toFixed(2)}`;

            document.getElementById('btnConfirmBuy').onclick = function() {
                document.getElementById('accPreviewModal').style.display = 'none';
                purchaseAccount(key, acc.price);
            };

            document.getElementById('accPreviewModal').style.display = 'flex';
        });
    }

    // ដំណើរការទិញ និងកាត់លុយ
    function purchaseAccount(key, price) {
        if (loggedInUser.balance < price) {
            return alert(`❌ សមតុល្យលុយមិនគ្រប់គ្រាន់!\nតម្លៃ៖ $${price.toFixed(2)}\nសមតុល្យអ្នក៖ $${loggedInUser.balance.toFixed(2)}\nសូមបញ្ចូលលុយជាមុនសិន!`);
        }

        db.ref('accounts_for_sale/' + key).once('value').then(snapshot => {
            const acc = snapshot.val();
            if (!acc || acc.status === 'sold') return alert("❌ សុំទោស អាខោននេះត្រូវបានគេទិញរួចហើយ!");

            loggedInUser.balance -= price;
            updateUI();

            db.ref('accounts_for_sale/' + key).update({
                status: 'sold',
                buyerEmail: loggedInUser.email,
                soldAt: Date.now()
            });

            document.getElementById('dispAccId').value = acc.acc_id || 'N/A';
            document.getElementById('dispAccPass').value = acc.acc_pass || 'N/A';
            document.getElementById('dispAcc2fa').value = acc.acc_2fa || 'N/A';
            document.getElementById('accountPurchasedModal').style.display = 'flex';
        });
    }

    function copyField(id) {
        const val = document.getElementById(id).value;
        navigator.clipboard.writeText(val);
        alert("✅ បានចម្លង៖ " + val);
    }

    function copyAllInfo() {
        const uid = document.getElementById('dispAccId').value;
        const pass = document.getElementById('dispAccPass').value;
        const tfa = document.getElementById('dispAcc2fa').value;
        navigator.clipboard.writeText(`UID/Email: ${uid}\nPassword: ${pass}\n2FA: ${tfa}`).then(() => {
            alert("✅ បានចម្លងព័ត៌មានទាំងអស់រួចរាល់!");
        });
    }
</script>
</body>
</html>
