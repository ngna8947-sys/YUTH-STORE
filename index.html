<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Game Top-Up & Account Store</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0b1120; color: #f8fafc; padding: 15px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Navbar */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
        .brand { font-size: 22px; font-weight: bold; color: #38bdf8; }
        .auth-bar { display: flex; align-items: center; gap: 10px; }
        .user-balance { background: #1e293b; padding: 8px 16px; border-radius: 20px; border: 1px solid #38bdf8; font-weight: bold; color: #38bdf8; }
        
        /* Google Button */
        .btn-google { background: #ffffff; color: #1e293b; padding: 8px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .btn-google:hover { background: #f1f5f9; }
        .btn-logout { background: #ef4444; color: #fff; padding: 8px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Grid & Cards */
        .section-title { color: #38bdf8; margin: 25px 0 15px 0; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .card img { width: 100%; height: 140px; object-fit: cover; background: #0f172a; }
        .card-body { padding: 12px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .card-price { color: #4ade80; font-weight: bold; font-size: 15px; }

        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 14px; width: 90%; max-width: 400px; border: 1px solid #38bdf8; text-align: center; }
        .modal-content h3 { margin-bottom: 15px; color: #38bdf8; }
        .btn-confirm { background: #38bdf8; color: #0b1120; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn-cancel { background: #64748b; color: #fff; padding: 8px 20px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <div class="header">
        <div class="brand">🔥 YUTH STORE</div>
        <div class="auth-bar" id="authSection">
            <button class="btn-google" id="btnLogin" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                ចូលប្រើជាមួយ Google
            </button>
            <div id="userProfile" style="display: none; align-items: center; gap: 10px;">
                <span class="user-balance" id="userBalanceDisplay">សមតុល្យ: $0.00</span>
                <span id="userNameDisplay" style="font-weight: bold;"></span>
                <button class="btn-logout" onclick="logout()">ចាកចេញ</button>
            </div>
        </div>
    </div>

    <!-- Section Services -->
    <h3 class="section-title">🎮 សេវាកម្មបញ្ចូលពេជ្រហ្គេម</h3>
    <div class="grid" id="servicesGrid">
        <p style="color: #64748b;">មិនទាន់មានសេវាកម្មទេ</p>
    </div>

    <!-- Section Accounts -->
    <h3 class="section-title">🛒 ហាងលក់ Account (Facebook / Game)</h3>
    <div class="grid" id="accountsGrid">
        <div class="card" onclick="openOrderModal('facebook', 1.00)">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" alt="Item">
            <div class="card-body">
                <div class="card-title">facebook</div>
                <p style="font-size: 13px; color: #94a3b8; margin-bottom: 5px;">🗓️ 2020</p>
                <div class="card-price">$1.00</div>
                <button class="btn-confirm" style="margin-top: 8px; padding: 6px 12px; font-size: 13px;">🔍 មើល & ទិញ</button>
            </div>
        </div>
    </div>
</div>

<!-- Buy Modal -->
<div class="modal" id="orderModal">
    <div class="modal-content">
        <h3 id="modalTitle">ទិញទំនិញ</h3>
        <p id="modalPrice" style="color: #4ade80; font-size: 18px; font-weight: bold; margin-bottom: 15px;">$0.00</p>
        <p style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">សូមចុចបញ្ជាក់ដើម្បីទិញទំនិញនេះ</p>
        <button class="btn-confirm" onclick="confirmPurchase()">បញ្ជាក់ការទិញ</button>
        <button class="btn-cancel" onclick="closeOrderModal()">បោះបង់</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnKL2cuZSGdtfxBbKq_otyi692HFMhD5o",
        authDomain: "yuth-store.firebaseapp.com",
        databaseURL: "https://yuth-store-default-rtdb.firebaseio.com",
        projectId: "yuth-store",
        storageBucket: "yuth-store.firebasestorage.app",
        messagingSenderId: "76819152698",
        appId: "1:76819152698:web:64153383c57412343dda03",
        measurementId: "G-LT8LVZ7W6R"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const database = firebase.database();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    let currentUser = null;
    let selectedItem = null;

    function loginWithGoogle() {
        auth.signInWithPopup(googleProvider)
            .then((result) => {
                console.log("Logged in successfully:", result.user);
            })
            .catch((error) => {
                alert("❌ Login Google បរាជ័យ: " + error.message);
            });
    }

    function logout() {
        auth.signOut().then(() => {
            alert("បានចាកចេញដោយជោគជ័យ!");
        });
    }

    // មុខងារអានសមតុល្យតាមគ្រប់ទម្រង់ដែល Telegram Bot បានបញ្ចូល
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userNameDisplay').innerText = user.displayName || user.email;
            
            const emailKey = user.email ? user.email.replace(/\./g, ',') : '';
            const emailDirect = user.email || '';

            // អានទិន្នន័យពី Database
            database.ref('users').on('value', (snapshot) => {
                const allUsers = snapshot.val() || {};
                let userBalance = 0;

                // ពិនិត្យគ្រប់ទីតាំងដែលអាចមានសមតុល្យរបស់ Bot
                if (allUsers[user.uid]) {
                    userBalance = typeof allUsers[user.uid] === 'number' ? allUsers[user.uid] : (allUsers[user.uid].balance || 0);
                } else if (emailKey && allUsers[emailKey]) {
                    userBalance = typeof allUsers[emailKey] === 'number' ? allUsers[emailKey] : (allUsers[emailKey].balance || 0);
                } else if (emailDirect && allUsers[emailDirect]) {
                    userBalance = typeof allUsers[emailDirect] === 'number' ? allUsers[emailDirect] : (allUsers[emailDirect].balance || 0);
                }

                document.getElementById('userBalanceDisplay').innerText = 'សមតុល្យ: $' + Number(userBalance).toFixed(2);
            });
        } else {
            currentUser = null;
            document.getElementById('btnLogin').style.display = 'flex';
            document.getElementById('userProfile').style.display = 'none';
        }
    });

    function openOrderModal(title, price) {
        if (!currentUser) {
            alert("សូមធ្វើការ Login ជាមុនសិន!");
            return;
        }
        selectedItem = { title, price };
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalPrice').innerText = '$' + price.toFixed(2);
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function confirmPurchase() {
        if (!currentUser || !selectedItem) return;
        alert("ការបញ្ជាទិញ " + selectedItem.title + " បានជោគជ័យ!");
        closeOrderModal();
    }
</script>
</body>
</html>
