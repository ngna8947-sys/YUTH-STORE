<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - YUTH STORE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary: #1877f2;
            --danger: #e41e3f;
            --success: #31a24c;
            --dark: #1c1e21;
            --bg: #f0f2f5;
            --border: #e4e6eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Hanuman', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; color: var(--dark); }

        .sidebar { width: 250px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; transition: 0.3s; }
        .sidebar-header { padding: 18px; font-size: 19px; font-weight: 800; color: var(--danger); text-align: center; border-bottom: 1px solid var(--border); }
        .sidebar-menu { list-style: none; padding: 10px 0; flex: 1; }
        .menu-item { padding: 14px 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; border-left: 4px solid transparent; }
        .menu-item:hover, .menu-item.active { background: #e8f0fe; color: var(--primary); border-left-color: var(--primary); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        .topbar { background: white; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .page-title { font-size: 16px; font-weight: 700; }

        .content-body { flex: 1; padding: 15px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Multi-User Chat Layout */
        .chat-container { display: flex; height: calc(100vh - 120px); background: white; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        .chat-user-list { width: 220px; border-right: 1px solid var(--border); overflow-y: auto; background: #fafafa; }
        .chat-user-item { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .chat-user-item.active { background: #e8f0fe; border-left: 4px solid var(--primary); }
        .chat-user-name { font-weight: bold; font-size: 13px; }
        .chat-user-email { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-room { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .chat-room-header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: bold; background: #fafafa; }
        .chat-room-messages { flex: 1; padding: 12px; overflow-y: auto; background: #f0f2f5; display: flex; flex-direction: column; gap: 8px; }
        
        .admin-msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 12px; word-break: break-word; }
        .admin-msg-bubble.guest { background: white; align-self: flex-start; }
        .admin-msg-bubble.admin { background: var(--primary); color: white; align-self: flex-end; }

        .chat-room-input { padding: 8px 10px; background: white; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; width: 100%; }
        .chat-room-input input[type="text"] { flex: 1; min-width: 0; padding: 7px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; outline: none; }
        .btn-admin-send { background: var(--primary); color: white; border: none; width: 34px; height: 34px; min-width: 34px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">🛠️ YUTH ADMIN</div>
        <ul class="sidebar-menu">
            <li class="menu-item" onclick="switchTab('dashboardTab', this)">📊 Dashboard</li>
            <li class="menu-item active" onclick="switchTab('chatTab', this)">💬 ឆាតជាមួយភ្ញៀវ</li>
            <li class="menu-item" onclick="switchTab('usersTab', this)">👥 បញ្ជីអ្នកចុះឈ្មោះ</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="page-title" id="pageTitle">ឆាតជាមួយភ្ញៀវ (Live Chat)</div>
            <div>Admin: <b>Samnang Mon</b></div>
        </div>

        <div class="content-body">
            <!-- TAB 1: LIVE CHAT (បង្ហាញភ្ញៀវថ្មីស្វ័យប្រវត្តិ) -->
            <div id="chatTab" class="tab-content active">
                <div class="chat-container">
                    <!-- បញ្ជីភ្ញៀវ Real-time -->
                    <div class="chat-user-list" id="chatUserList"></div>

                    <!-- បន្ទប់ឆាត -->
                    <div class="chat-room">
                        <div class="chat-room-header">
                            ជជែកជាមួយ៖ <b id="activeChatUserName" style="color:var(--primary);">ជ្រើសរើសភ្ញៀវ</b>
                        </div>
                        <div class="chat-room-messages" id="adminChatLogs">
                            <div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">
                                សូមចុចលើឈ្មោះភ្ញៀវនៅខាងឆ្វេង ដើម្បីមើលសារ
                            </div>
                        </div>
                        <div class="chat-room-input">
                            <input type="text" id="adminChatInput" placeholder="វាយសារតប..." onkeypress="if(event.key==='Enter') adminSendMsg()">
                            <button class="btn-admin-send" onclick="adminSendMsg()">➤</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: USERS DIRECTORY -->
            <div id="usersTab" class="tab-content">
                <div style="background:white; padding:15px; border-radius:12px; border:1px solid #ddd;">
                    <h3 style="margin-bottom:15px;">👥 បញ្ជីឈ្មោះ & អ៊ីម៉ែលអ្នកចុះឈ្មោះ</h3>
                    <div id="usersListContainer">កំពុងទាញយក...</div>
                </div>
            </div>

            <!-- TAB 3: DASHBOARD -->
            <div id="dashboardTab" class="tab-content">
                <h3>ផ្ទាំងគ្រប់គ្រងទូទៅ</h3>
            </div>
        </div>
    </div>

    <script>
        let currentActiveUid = null;

        // មុខងារទាញយកបញ្ជីភ្ញៀវ Real-Time
        function loadLiveChats() {
            const rawData = localStorage.getItem('yuth_active_chats');
            const activeChats = rawData ? JSON.parse(rawData) : {};
            const userListEl = document.getElementById('chatUserList');
            const usersContainer = document.getElementById('usersListContainer');
            
            userListEl.innerHTML = '';
            let usersTableHtml = '<table width="100%" style="border-collapse:collapse; font-size:13px;"><tr style="background:#f8f9fa; text-align:left;"><th style="padding:8px;">ឈ្មោះ</th><th>អ៊ីម៉ែល</th></tr>';

            const uids = Object.keys(activeChats);

            if (uids.length === 0) {
                userListEl.innerHTML = '<div style="padding:15px; font-size:11px; color:#888;">មិនទាន់មានភ្ញៀវចូល</div>';
            }

            uids.forEach((uid, index) => {
                const user = activeChats[uid];
                const isActive = uid === currentActiveUid ? 'active' : '';

                // Add to sidebar user list
                userListEl.innerHTML += `
                    <div class="chat-user-item ${isActive}" onclick="selectUser('${uid}', '${user.name}')">
                        <div class="chat-user-name">${user.name}</div>
                        <div class="chat-user-email">${user.email}</div>
                    </div>
                `;

                // Add to Users Tab
                usersTableHtml += `
                    <tr style="border-bottom:1px solid #eee;">
                        <td style="padding:8px;"><b>${user.name}</b></td>
                        <td>${user.email}</td>
                    </tr>
                `;

                // Auto select first user
                if (!currentActiveUid && index === 0) {
                    selectUser(uid, user.name);
                }
            });

            usersTableHtml += '</table>';
            usersContainer.innerHTML = usersTableHtml;

            // Refresh message log if user selected
            if (currentActiveUid && activeChats[currentActiveUid]) {
                renderMessages(activeChats[currentActiveUid].messages || []);
            }
        }

        function selectUser(uid, name) {
            currentActiveUid = uid;
            document.getElementById('activeChatUserName').innerText = name;
            
            document.querySelectorAll('.chat-user-item').forEach(el => el.classList.remove('active'));
            loadLiveChats();
        }

        function renderMessages(messages) {
            const logs = document.getElementById('adminChatLogs');
            logs.innerHTML = '';
            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `admin-msg-bubble ${msg.sender}`;
                bubble.innerText = msg.text;
                logs.appendChild(bubble);
            });
            logs.scrollTop = logs.scrollHeight;
        }

        function adminSendMsg() {
            const input = document.getElementById('adminChatInput');
            const text = input.value.trim();
            if (!text || !currentActiveUid) return;

            const activeChats = JSON.parse(localStorage.getItem('yuth_active_chats') || '{}');
            if (activeChats[currentActiveUid]) {
                activeChats[currentActiveUid].messages.push({ sender: 'admin', text: text });
                localStorage.setItem('yuth_active_chats', JSON.stringify(activeChats));
                loadLiveChats();
            }

            input.value = '';
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        // ត្រួតពិនិត្យភ្ញៀវថ្មីជារៀងរាល់ ១ វិនាទី (Real-time Scanner)
        setInterval(loadLiveChats, 1000);
        loadLiveChats();
    </script>
</body>
</html>
