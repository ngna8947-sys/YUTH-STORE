<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUTH STORE - Admin Dashboard</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; margin: 0; padding: 0; }
        body { background: #090e17; color: #f8fafc; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* Header */
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 25px; }
        .brand { font-size: 22px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #131c2e; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; }
        .stat-card h4 { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #38bdf8; }

        /* Action Panel */
        .panel { background: #131c2e; border: 1px solid #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 25px; }
        .panel h3 { color: #38bdf8; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .form-row input { flex: 1; min-width: 200px; padding: 11px; background: #0b1120; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .form-row input:focus { border-color: #38bdf8; }
        .btn-topup { background: #0284c7; color: #fff; border: none; padding: 11px 22px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-topup:hover { background: #38bdf8; color: #090e17; }

        /* Orders Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #0b1120; color: #94a3b8; font-weight: 600; }
        tr:hover { background: rgba(56, 189, 248, 0.03); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .badge.pending { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge.completed { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .btn-done { background: #22c55e; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-header">
        <div class="brand"><i class="fa-solid fa-shield-halved"></i> YUTH STORE - Admin Dashboard</div>
        <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> ទៅកាន់ទំព័រមុខ</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4><i class="fa-solid fa-cart-shopping"></i> ការបញ្ជាទិញសរុប</h4>
            <div class="value" id="statOrders">0</div>
        </div>
        <div class="stat-card">
            <h4><i class="fa-solid fa-clock"></i> រង់ចាំដំណើរការ (Pending)</h4>
            <div class="value" style="color: #facc15;" id="statPending">0</div>
        </div>
    </div>

    <!-- Manual Top-up Panel -->
    <div class="panel">
        <h3><i class="fa-solid fa-wallet"></i> បញ្ចូលសមតុល្យឱ្យសមាជិក (Manual Top-Up)</h3>
        <div class="form-row">
            <input type="text" id="manualEmail" placeholder="អ៊ីមែលអ្នកប្រើប្រាស់ (ឧ. user@gmail.com)">
            <input type="number" id="manualAmount" placeholder="ចំនួនទឹកប្រាក់ ($) ឧ. 10">
            <button class="btn-topup" onclick="addManualBalance()">បញ្ចូលលុយ</button>
        </div>
    </div>

    <!-- Orders Management -->
    <div class="panel">
        <h3><i class="fa-solid fa-list-check"></i> បញ្ជីការបញ្ជាទិញ (Orders List)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>កាលបរិច្ឆេទ</th>
                        <th>អ៊ីមែល</th>
                        <th>ទំនិញ</th>
                        <th>Player ID</th>
                        <th>តម្លៃ</th>
                        <th>ស្ថានភាព</th>
                        <th>សកម្មភាព</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="7" style="text-align: center; color: #64748b;">មិនទាន់មានការបញ្ជាទិញទេ</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBnKL2cuZSGdtfxBbKq_otyi692HFMhD5o",
        authDomain: "yuth-store.firebaseapp.com",
        databaseURL: "https://yuth-store-default-rtdb.firebaseio.com",
        projectId: "yuth-store",
        storageBucket: "yuth-store.firebasestorage.app",
        messagingSenderId: "76819152698",
        appId: "1:76819152698:web:64153383c57412343dda03",
        measurementId: "G-LT8LVZ7W6R"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // បញ្ចូលលុយ Manual
    function addManualBalance() {
        const email = document.getElementById('manualEmail').value.trim();
        const amt = parseFloat(document.getElementById('manualAmount').value);

        if (!email || isNaN(amt) || amt <= 0) return alert("សូមបញ្ចូលអ៊ីមែល និងចំនួនទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!");
        const emailKey = email.replace(/\./g, ',');

        database.ref('users/' + emailKey).once('value', (snap) => {
            let current = 0;
            const data = snap.val();
            if (typeof data === 'number') current = data;
            else if (data && data.balance !== undefined) current = data.balance;

            const newTotal = current + amt;
            database.ref('users/' + emailKey).set({ balance: newTotal }, (err) => {
                if (!err) {
                    alert("✅ បានបញ្ចូល $" + amt + " ទៅកាន់ " + email + " ជោគជ័យ! (សមតុល្យថ្មី: $" + newTotal + ")");
                    document.getElementById('manualAmount').value = '';
                } else {
                    alert("Error: " + err.message);
                }
            });
        });
    }

    // Realtime Orders
    database.ref('orders').on('value', (snap) => {
        const orders = snap.val() || {};
        const tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = '';

        let total = 0, pending = 0;

        Object.keys(orders).reverse().forEach((key) => {
            const ord = orders[key];
            total++;
            if (ord.status === 'pending') pending++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${ord.time || '-'}</td>
                <td>${ord.user || '-'}</td>
                <td style="color: #38bdf8; font-weight: bold;">${ord.item}</td>
                <td><code style="background:#0b1120; padding:3px 6px; border-radius:4px;">${ord.targetId}</code></td>
                <td style="color: #4ade80; font-weight: bold;">$${Number(ord.price).toFixed(2)}</td>
                <td><span class="badge ${ord.status}">${ord.status === 'pending' ? 'រង់ចាំ' : 'ជោគជ័យ'}</span></td>
                <td>
                    ${ord.status === 'pending' ? `<button class="btn-done" onclick="completeOrder('${key}')">✓ បញ្ចប់</button>` : '<i class="fa-solid fa-check" style="color:#22c55e;"></i>'}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('statOrders').innerText = total;
        document.getElementById('statPending').innerText = pending;
    });

    function completeOrder(key) {
        if (confirm("តើអ្នកបានបញ្ចូលពេជ្រជូនភ្ញៀវរួចរាល់ហើយមែនទេ?")) {
            database.ref('orders/' + key).update({ status: 'completed' });
        }
    }
</script>
</body>
</html>
