<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Game & Account Management</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        h2, h3 { color: #38bdf8; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .btn-green { background: #10b981; color: #fff; padding: 12px; width: 100%; margin-top: 15px; }
        .btn-green:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; }
        .badge-available { background: #10b981; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .badge-sold { background: #ef4444; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ ផ្ទាំងគ្រប់គ្រង Admin</h2>

    <!-- ១. ដាក់លក់ Account -->
    <div class="card">
        <h3>🛒 បន្ថែម Account សម្រាប់ដាក់លក់ (Facebook / Game)</h3>
        <div class="form-grid">
            <div>
                <label>ឈ្មោះ Account / ប្រភេទ៖</label>
                <input type="text" id="accTitle" placeholder="ឧ. Facebook Account 2018 / FF Level 60">
            </div>
            <div>
                <label>តម្លៃ ($ USD)៖</label>
                <input type="number" step="0.01" id="accPrice" placeholder="ឧ. 15.00">
            </div>
            <div>
                <label>Link រូបភាព Logo / Profile (URL)៖</label>
                <input type="text" id="accThumb" placeholder="https://...">
            </div>
            <div>
                <label>Link រូបភាព Screenshot បង្ហាញអាខោន (URL)៖</label>
                <input type="text" id="accImage" placeholder="https://...">
            </div>
            <div>
                <label>🆔 UID / Email / Username (លេខសម្ងាត់)៖</label>
                <input type="text" id="accUid" placeholder="100082348234">
            </div>
            <div>
                <label>🔑 Password (លេខសម្ងាត់)៖</label>
                <input type="text" id="accPass" placeholder="Pass@12345">
            </div>
            <div class="full-width">
                <label>🛡️ 2FA Key / Backup Code (លេខកូដសុវត្ថិភាព)៖</label>
                <input type="text" id="acc2fa" placeholder="JBSWY3DPEHPK3PXP">
            </div>
        </div>
        <button class="btn-green" onclick="addNewAccount()">➕ បង្ហោះលក់ Account នេះ</button>
    </div>

    <!-- ២. បញ្ជី Account ទាំងអស់ -->
    <div class="card">
        <h3>📋 បញ្ជី Account ទាំងអស់ក្នុងប្រព័ន្ធ</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>រូបភាព</th>
                        <th>ឈ្មោះ Account</th>
                        <th>តម្លៃ</th>
                        <th>UID / Login</th>
                        <th>Password</th>
                        <th>ស្ថានភាព</th>
                        <th>សកម្មភាព</th>
                    </tr>
                </thead>
                <tbody id="accountsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://yuth-store-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function addNewAccount() {
        const title = document.getElementById('accTitle').value.trim();
        const price = parseFloat(document.getElementById('accPrice').value);
        const thumb = document.getElementById('accThumb').value.trim();
        const image = document.getElementById('accImage').value.trim();
        const uid = document.getElementById('accUid').value.trim();
        const pass = document.getElementById('accPass').value.trim();
        const tfa = document.getElementById('acc2fa').value.trim();

        if (!title || isNaN(price) || price <= 0 || !uid || !pass) {
            return alert("សូមបំពេញឈ្មោះ តម្លៃ UID និង Password ឱ្យបានត្រឹមត្រូវ!");
        }

        const newAccount = {
            title: title,
            price: price,
            thumb: thumb || 'https://via.placeholder.com/100',
            image: image || thumb || 'https://via.placeholder.com/300',
            acc_id: uid,
            acc_pass: pass,
            acc_2fa: tfa || 'គ្មាន',
            status: 'available',
            createdAt: Date.now()
        };

        db.ref('accounts_for_sale').push(newAccount).then(() => {
            alert("✅ បានបង្ហោះដាក់លក់ Account ជោគជ័យ!");
            document.getElementById('accTitle').value = '';
            document.getElementById('accPrice').value = '';
            document.getElementById('accThumb').value = '';
            document.getElementById('accImage').value = '';
            document.getElementById('accUid').value = '';
            document.getElementById('accPass').value = '';
            document.getElementById('acc2fa').value = '';
        }).catch(err => alert("❌ បរាជ័យ៖ " + err.message));
    }

    db.ref('accounts_for_sale').on('value', snapshot => {
        const tbody = document.getElementById('accountsTableBody');
        tbody.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">មិនទាន់មាន Account នៅឡើយទេ។</td></tr>';
            return;
        }

        for (let key in data) {
            const acc = data[key];
            const status = acc.status === 'sold' 
                ? '<span class="badge-sold">លក់ដាច់ហើយ</span>' 
                : '<span class="badge-available">នៅសល់</span>';

            tbody.innerHTML += `
                <tr>
                    <td><img src="${acc.thumb}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;"></td>
                    <td><strong>${acc.title}</strong></td>
                    <td style="color:#38bdf8; font-weight:bold;">$${parseFloat(acc.price).toFixed(2)}</td>
                    <td><code>${acc.acc_id}</code></td>
                    <td><code>${acc.acc_pass}</code></td>
                    <td>${status}</td>
                    <td>
                        <button onclick="deleteAccount('${key}')" style="padding:6px 10px; background:#ef4444; color:#fff; font-size:12px;">🗑️ លុប</button>
                    </td>
                </tr>
            `;
        }
    });

    function deleteAccount(key) {
        if (confirm("តើអ្នកពិតជាចង់លុប Account នេះមែនទេ?")) {
            db.ref('accounts_for_sale/' + key).remove();
        }
    }
</script>
</body>
</html>
